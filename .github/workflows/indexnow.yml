name: IndexNow ping

on:
  push:
    branches: [main]
    paths: ["**.html", "sitemap.xml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: meunomenaoejonny.github.io
      BASE: https://meunomenaoejonny.github.io/gabf-mvp/
      KEY: 027b68d185cafe856af075bd49a1c631
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages to serve this commit's sitemap and key
        run: |
          want=$(sha256sum sitemap.xml | cut -d' ' -f1)
          for i in $(seq 1 40); do
            got=$(curl -fsSL "${BASE}sitemap.xml?nocache=$RANDOM" | sha256sum | cut -d' ' -f1 || true)
            key=$(curl -fsSL "${BASE}${KEY}.txt?nocache=$RANDOM" || true)
            if [ "$got" = "$want" ] && [ "$key" = "$KEY" ]; then echo "Pages is live"; exit 0; fi
            echo "waiting for Pages ($i/40)"; sleep 15
          done
          echo "Pages did not update in time"; exit 1

      - name: Ping IndexNow with all sitemap URLs
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##' | jq -R . | jq -s .)
          body=$(jq -n --arg host "$HOST" --arg key "$KEY" --arg kl "${BASE}${KEY}.txt" --argjson urls "$urls" \
            '{host:$host,key:$key,keyLocation:$kl,urlList:$urls}')
          echo "$body"
          code=$(curl -s -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data "$body")
          echo "IndexNow HTTP $code"; cat resp.txt || true
          case "$code" in 200|202) exit 0 ;; *) exit 1 ;; esac
